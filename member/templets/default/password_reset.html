{seacms:top}
<div class="row member-layout">
  <div class="col-md-6 col-md-offset-3 col-sm-12">
    <section class="member-card">
      <div class="card-head"><h2>重置密码</h2><span class="card-sub">账户：{member:repswname}</span></div>
      <div class="card-body">
        <form action="index.php?mod=repsw4" method="post" class="profile-form">
          <input type="hidden" name="repswname" value="{member:repswname}">
          <input type="hidden" name="repswcode" value="{member:repswcode}">
          <div class="form-group">
            <label>新密码</label>
            <input type="password" name="repswnew1" class="form-control" placeholder="请输入新密码" required>
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" name="repswnew2" class="form-control" placeholder="请再次输入新密码" required>
          </div>
          <button type="submit" class="btn btn-warning btn-block">确认重置</button>
        </form>
      </div>
    </section>
  </div>
</div>
{seacms:foot}
