{seacms:top}
<div class="row member-layout">
  <div class="col-md-3 col-sm-12">{seacms:load menu.html}</div>
  <div class="col-md-9 col-sm-12">
    <section class="member-card">
      <div class="card-head">
        <h2>我的留言</h2>
        <span class="card-sub">共 {member:total} 条留言</span>
      </div>
      <div class="card-body">
        {member:gb}
        <div class="panel panel-info member-panel">
          <div class="panel-heading">
            <a target="_blank" href="/gbook.php">[gb:title]</a>
            <span class="panel-time">[gb:time]
              <a class="text-danger" onclick="return confirm('确定要删除吗?')" href="[gb:delurl]"><i class="icon iconfont icon-delete"></i> 删除</a>
            </span>
          </div>
          <div class="panel-body">[gb:msg]</div>
        </div>
        {/member:gb}
        {member:gb-empty}<p class="text-center text-muted">暂无留言</p>{/member:gb-empty}
        {member:pager}
      </div>
    </section>
  </div>
</div>
{seacms:foot}
