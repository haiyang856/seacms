<script type="text/javascript">
document.getElementById('formsearch').addEventListener('submit', function(e) {
    e.preventDefault();
    
    var userid = this.userid.value.trim();
    var pwd = this.pwd.value.trim();
    var validate = this.validate ? this.validate.value.trim() : '';
    var gotopage = this.gotopage.value;
    var dopost = 'login';
    var resultDiv = document.getElementById('ajax_result');
    
    if(!userid) {
        showResult('请输入管理员账号！', 'error');
        return false;
    }
    
    if(!pwd) {
        showResult('请输入管理员密码！', 'error');
        return false;
    }
    

    
    showResult('正在验证，请稍候...', 'loading');
    
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'login.php', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onreadystatechange = function() {
        if(xhr.readyState === 4) {
            if(xhr.status === 200) {
                try {
                    var response = JSON.parse(xhr.responseText);
                    if(response.code === 1 || response.success === true) {
                        showResult(response.msg || '登录成功，正在跳转...', 'success');
                        setTimeout(function() {
                            window.location.href = (response.data && response.data.url) ? response.data.url : 
                                                   (gotopage && gotopage !== '' ? gotopage : 'index.php');
                        }, 1000);
                    } else {
                        showResult(response.msg || '登录失败：' + (response.error || '未知错误'), 'error');
                        refreshCode();
                    }
                } catch(e) {
                    console.log('AJAX Response:', xhr.responseText);
                    var responseText = xhr.responseText.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
                    if(responseText.length > 0) {
                        showResult('服务器返回：' + responseText, 'error');
                    } else {
                        showResult('登录响应异常，请检查网络或联系管理员', 'error');
                    }
                    refreshCode();
                }
            } else {
                showResult('网络错误（状态码：' + xhr.status + '），请检查网络连接后重试', 'error');
                refreshCode();
            }
        }
    };
    
    xhr.send('userid=' + encodeURIComponent(userid) + '&pwd=' + encodeURIComponent(pwd) + 
             '&validate=' + encodeURIComponent(validate) + '&gotopage=' + encodeURIComponent(gotopage) + 
             '&dopost=' + dopost);
    
    return false;
});

function showResult(message, type) {
    var resultDiv = document.getElementById('ajax_result');
    resultDiv.style.display = 'block';
    resultDiv.className = '';
    resultDiv.innerHTML = message;
    
    switch(type) {
        case 'success':
            resultDiv.classList.add('ajax_success');
            break;
        case 'error':
            resultDiv.classList.add('ajax_error');
            break;
        case 'loading':
            resultDiv.classList.add('loading');
            break;
    }
}

function refreshCode() {
    var codeImg = document.getElementById('code_img');
    if(codeImg) {
        codeImg.src = codeImg.src.split('?')[0] + '?get=' + new Date().getTime();
    }
}
</script>
